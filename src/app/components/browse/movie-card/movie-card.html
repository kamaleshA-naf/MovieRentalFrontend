<div class="card" (click)="cardClick.emit(movie())">
  <div class="thumb-wrap">
    <img
      [src]="imgSrc()"
      [alt]="movie().title"
      class="thumb"
      (error)="onImgError()"
      loading="lazy" />

    @if (movie().topTen) {
      <span class="badge top10">Top 10</span>
    } @else if (movie().isNew) {
      <span class="badge new-badge">New</span>
    }

    <div class="overlay">
      <button class="ov-btn play" title="Play">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor">
          <path d="M8 5v14l11-7z"/>
        </svg>
      </button>
      <button
        class="ov-btn list"
        [class.added]="store.isInMyList(movie().id)"
        (click)="toggleList($event)"
        title="My List">
        @if (store.isInMyList(movie().id)) {
          <svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor">
            <path d="M9 16.17L4.83 12l-1.42 1.41L9 19 21 7l-1.41-1.41z"/>
          </svg>
        } @else {
          <svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor">
            <path d="M19 13h-6v6h-2v-6H5v-2h6V5h2v6h6v2z"/>
          </svg>
        }
      </button>
    </div>
  </div>

  <div class="info">
    <p class="title">{{ movie().title }}</p>
    <p class="meta">{{ movie().releaseYear }} · {{ movie().language }}</p>
  </div>
</div>
