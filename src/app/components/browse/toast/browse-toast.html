<div class="toast-stack">
  @for (t of toast.toasts(); track t.id) {
    <div class="toast" [class]="'toast-' + t.type">
      <span class="toast-icon">
        @switch (t.type) {
          @case ('success') { ✓ }
          @case ('error')   { ✕ }
          @case ('warning') { ⚠ }
          @default          { ℹ }
        }
      </span>
      <span class="toast-msg">{{ t.message }}</span>
      <button class="toast-close" (click)="toast.dismiss(t.id)">×</button>
    </div>
  }
</div>
