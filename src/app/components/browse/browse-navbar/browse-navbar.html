<nav class="bnav">
  <div class="bnav-inner">

    <!-- Logo -->
    <a class="bnav-logo" routerLink="/browse">
      <div class="logo-icon">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="white">
          <path d="M18 3v2h-2V3H8v2H6V3H4v18h2v-2h2v2h8v-2h2v2h2V3h-2zM8 17H6v-2h2v2zm0-4H6v-2h2v2zm0-4H6V7h2v2zm10 8h-2v-2h2v2zm0-4h-2v-2h2v2zm0-4h-2V7h2v2z"/>
        </svg>
      </div>
      <span class="logo-text">MovieBox</span>
    </a>

    <!-- Search box (visible when active) -->
    @if (showSearch()) {
      <div class="search-box">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="currentColor" class="s-ico">
          <path d="M15.5 14h-.79l-.28-.27C15.41 12.59 16 11.11 16 9.5 16 5.91 13.09 3 9.5 3S3 5.91 3 9.5 5.91 16 9.5 16c1.61 0 3.09-.59 4.23-1.57l.27.28v.79l5 4.99L20.49 19l-4.99-5zm-6 0C7.01 14 5 11.99 5 9.5S7.01 5 9.5 5 14 7.01 14 9.5 11.99 14 9.5 14z"/>
        </svg>
        <input
          type="text"
          placeholder="Search movies..."
          [(ngModel)]="searchQuery"
          (ngModelChange)="search.emit($event)"
          autofocus />
        <button class="s-close" (click)="showSearch.set(false); search.emit('')">×</button>
      </div>
    }

    <div class="bnav-right">
      @if (!showSearch()) {
        <button class="nav-icon-btn" (click)="showSearch.set(true)" title="Search">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor">
            <path d="M15.5 14h-.79l-.28-.27C15.41 12.59 16 11.11 16 9.5 16 5.91 13.09 3 9.5 3S3 5.91 3 9.5 5.91 16 9.5 16c1.61 0 3.09-.59 4.23-1.57l.27.28v.79l5 4.99L20.49 19l-4.99-5zm-6 0C7.01 14 5 11.99 5 9.5S7.01 5 9.5 5 14 7.01 14 9.5 11.99 14 9.5 14z"/>
          </svg>
        </button>
      }

      <button class="nav-icon-btn" (click)="openCategories.emit()" title="Browse Categories">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor">
          <path d="M3 18h18v-2H3v2zm0-5h18v-2H3v2zm0-7v2h18V6H3z"/>
        </svg>
      </button>

      <a class="nav-icon-btn admin-link" routerLink="/browse/admin" title="Admin">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor">
          <path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm-2 15l-5-5 1.41-1.41L10 14.17l7.59-7.59L19 8l-9 9z"/>
        </svg>
      </a>
    </div>

  </div>
</nav>
