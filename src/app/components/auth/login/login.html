<div class="login-page">
  <div class="cinema-bg"></div>
  <div class="overlay"></div>

  <div class="login-container">
    <div class="brand">
      <div class="brand-icon">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="white">
          <polygon points="10,8 10,16 17,12"/>
        </svg>
      </div>
      <span>MovieBox</span>
    </div>

    <div class="login-card">
      <h1 class="card-title">Sign In</h1>
      <p class="card-sub">Good to see you again</p>

      @if (auth.error()) {
        <div class="error-banner">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor">
            <path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm1 15h-2v-2h2v2zm0-4h-2V7h2v6z"/>
          </svg>
          {{ auth.error() }}
        </div>
      }

      <div class="form-group">
        <label class="form-label">Email Address</label>
        <div class="input-wrap">
          <svg class="input-icon" width="16" height="16" viewBox="0 0 24 24" fill="currentColor">
            <path d="M20 4H4c-1.1 0-2 .9-2 2v12c0 1.1.9 2 2 2h16c1.1 0 2-.9 2-2V6c0-1.1-.9-2-2-2zm0 4l-8 5-8-5V6l8 5 8-5v2z"/>
          </svg>
          <input type="email"
            placeholder="you@email.com"
            [ngModel]="email()"
            (ngModelChange)="email.set($event); auth.error.set(null)"
            (keyup.enter)="submit()"
            autocomplete="email" />
        </div>
      </div>

      <div class="form-group">
        <div class="label-row">
          <label class="form-label">Password</label>
          <!-- <button type="button" class="forgot-btn" -->
            <!-- [disabled]="forgotLoading()"
            (click)="forgotPassword()">
            @if (forgotLoading()) {
              <span class="forgot-spin"></span>
              Sending...
            } @else {
              Forgot password?
            } -->
          <!-- </button> -->
        </div>
        <div class="input-wrap">
          <svg class="input-icon" width="16" height="16" viewBox="0 0 24 24" fill="currentColor">
            <path d="M18 8h-1V6c0-2.76-2.24-5-5-5S7 3.24 7 6v2H6c-1.1 0-2 .9-2 2v10c0 1.1.9 2 2 2h12c1.1 0 2-.9 2-2V10c0-1.1-.9-2-2-2zm-6 9c-1.1 0-2-.9-2-2s.9-2 2-2 2 .9 2 2-.9 2-2 2zm3.1-9H8.9V6c0-1.71 1.39-3.1 3.1-3.1 1.71 0 3.1 1.39 3.1 3.1v2z"/>
          </svg>
          <input
            [type]="showPass() ? 'text' : 'password'"
            placeholder="••••••••••••"
            [ngModel]="password()"
            (ngModelChange)="password.set($event); auth.error.set(null)"
            (keyup.enter)="submit()"
            autocomplete="current-password" />
          <button type="button" class="show-pass" (click)="showPass.set(!showPass())">
            @if (showPass()) {
              <svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor">
                <path d="M12 4.5C7 4.5 2.73 7.61 1 12c1.73 4.39 6 7.5 11 7.5s9.27-3.11 11-7.5c-1.73-4.39-6-7.5-11-7.5zM12 17c-2.76 0-5-2.24-5-5s2.24-5 5-5 5 2.24 5 5-2.24 5-5 5zm0-8c-1.66 0-3 1.34-3 3s1.34 3 3 3 3-1.34 3-3-1.34-3-3-3z"/>
              </svg>
            } @else {
              <svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor">
                <path d="M12 7c2.76 0 5 2.24 5 5 0 .65-.13 1.26-.36 1.83l2.92 2.92c1.51-1.26 2.7-2.89 3.43-4.75-1.73-4.39-6-7.5-11-7.5-1.4 0-2.74.25-3.98.7l2.16 2.16C10.74 7.13 11.35 7 12 7zM2 4.27l2.28 2.28.46.46C3.08 8.3 1.78 10.02 1 12c1.73 4.39 6 7.5 11 7.5 1.55 0 3.03-.3 4.38-.84l.42.42L19.73 22 21 20.73 3.27 3 2 4.27zM7.53 9.8l1.55 1.55c-.05.21-.08.43-.08.65 0 1.66 1.34 3 3 3 .22 0 .44-.03.65-.08l1.55 1.55c-.67.33-1.41.53-2.2.53-2.76 0-5-2.24-5-5 0-.79.2-1.53.53-2.2zm4.31-.78l3.15 3.15.02-.16c0-1.66-1.34-3-3-3l-.17.01z"/>
              </svg>
            }
          </button>
        </div>
      </div>

      <button class="submit-btn" [disabled]="auth.isLoading()" (click)="submit()">
        @if (auth.isLoading()) {
          <span class="spinner"></span>
          Signing in...
        } @else {
          Sign In
          <svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor">
            <path d="M12 4l-1.41 1.41L16.17 11H4v2h12.17l-5.58 5.59L12 20l8-8z"/>
          </svg>
        }
      </button>

      <p class="register-link">
        New to MovieBox?
        <a routerLink="/register">Create an Account</a>
      </p>
    </div>
  </div>
</div>
